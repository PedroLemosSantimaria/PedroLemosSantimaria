<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0b3d1f"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dffb0"/>
      <stop offset="100%" stop-color="#00c24a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="none" stroke="url(#g)">
    <circle cx="200" cy="200" r="170" stroke-width="10"/>
    <circle cx="200" cy="200" r="145" stroke-width="3" stroke-dasharray="4 10"/>
    <!-- emblema: anel central com glifo P -->
    <circle cx="200" cy="200" r="95" stroke-width="14"/>
    <path d="M165 265 V135 H215 A38 38 0 0 1 215 211 H165" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- pontas laterais estilo tropa -->
    <path d="M30 200 H85 M315 200 H370" stroke-width="10" stroke-linecap="round"/>
    <path d="M200 30 V85 M200 315 V370" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
